<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kaveyl Wiki</title>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kaveyl Wiki" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the theme before first paint (no flash). SEE: src/theme.ts
      try {
        const t = localStorage.getItem('kaveyl-wiki.theme') || 'system';
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const bar = { lavender: '#ffffff', sand: '#ffffff', sage: '#fbfcf9', fjord: '#fbfcfd', heather: '#fdfbfd', classic: '#1e1e23', 'sand-dark': '#1d1a15', moss: '#182019', graphite: '#1f2023', black: '#0d0d0d' };
        const old = { plum: 'heather', amethyst: 'lavender', slate: 'lavender', oled: 'black', indigo: 'classic' };
        let p = localStorage.getItem(dark ? 'kaveyl-wiki.palette-dark' : 'kaveyl-wiki.palette-light');
        if (Object.hasOwn(old, p)) p = old[p];
        if (!Object.hasOwn(bar, p) || (dark ? ['lavender', 'sand', 'sage', 'fjord', 'heather'] : ['classic', 'sand-dark', 'moss', 'graphite', 'black']).includes(p)) p = dark ? 'classic' : 'lavender';
        document.documentElement.classList.toggle('dark', dark);
        if (p !== 'classic' && p !== 'lavender') document.documentElement.setAttribute('data-palette', p);
        document.querySelector('meta[name="theme-color"]').content = bar[p];
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
